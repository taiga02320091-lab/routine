<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ルーティン</title>

<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f6fa;
  color:#222;
}
header{
  background:white;
  padding:18px;
  font-size:24px;
  font-weight:bold;
  border-bottom:1px solid #ddd;
}
main{
  max-width:700px;
  margin:auto;
  padding:15px;
}
.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
button{
  border:0;
  border-radius:12px;
  padding:11px 15px;
  font-size:15px;
  cursor:pointer;
  background:#eee;
}
.primary{
  background:#222;
  color:white;
}
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:15px;
}
.tab{
  white-space:nowrap;
}
.tab.active{
  background:#222;
  color:white;
}
input{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin:5px 0;
}
.task{
  display:grid;
  grid-template-columns:110px 1fr auto;
  gap:7px;
  align-items:center;
  margin:8px 0;
}
.task input{
  margin:0;
}
.small{
  font-size:13px;
  color:#777;
}
.days{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.day{
  padding:8px 11px;
}
.day.selected{
  background:#222;
  color:white;
}
.danger{
  background:#ffe5e5;
  color:#c00;
}
</style>
</head>

<body>

<header>📋 ルーティン</header>

<main>

<div class="card">
  <button class="primary" onclick="enableNotifications()">
    🔔 通知をONにする
  </button>
  <p id="notificationStatus" class="small">
    通知はまだ設定されていません
  </p>
</div>

<div class="tabs" id="tabs"></div>

<div class="card">
  <button class="primary" onclick="addRoutine()">
    ＋ ルーティンを追加
  </button>
</div>

<div id="routineArea"></div>

</main>

<script>

let routines =
JSON.parse(localStorage.getItem("routines") || "null") || [
  {
    title:"平日のルーティン",
    days:[1,2,3,4,5],
    tasks:[
      {time:"07:00",text:"起床"},
      {time:"07:30",text:"朝ごはん"},
      {time:"08:00",text:"学校へ行く"}
    ]
  }
];

let currentRoutine = 0;

function save(){
  localStorage.setItem("routines",JSON.stringify(routines));
}

function renderTabs(){

  const tabs=document.getElementById("tabs");
  tabs.innerHTML="";

  routines.forEach((r,i)=>{

    const b=document.createElement("button");

    b.className="tab"+(i===currentRoutine?" active":"");
    b.textContent=r.title || "ルーティン"+(i+1);

    b.onclick=()=>{
      currentRoutine=i;
      render();
    };

    tabs.appendChild(b);
  });
}

function render(){

  renderTabs();

  const r=routines[currentRoutine];

  const area=document.getElementById("routineArea");

  area.innerHTML=`
    <div class="card">

      <h2>ルーティン設定</h2>

      <input
        value="${r.title}"
        placeholder="ルーティン名"
        onchange="changeTitle(this.value)"
      >

      <h3>曜日</h3>

      <div class="days">

        ${["日","月","火","水","木","金","土"]
        .map((d,i)=>`
          <button
            class="day ${r.days.includes(i)?"selected":""}"
            onclick="toggleDay(${i})"
          >${d}</button>
        `).join("")}

      </div>

    </div>

    <div class="card">

      <h2>予定</h2>

      <div id="tasks">

        ${r.tasks.map((t,i)=>`

          <div class="task">

            <input
              type="time"
              step="300"
              value="${t.time}"
              onchange="changeTime(${i},this.value)"
            >

            <input
              value="${t.text}"
              placeholder="やること"
              onchange="changeText(${i},this.value)"
            >

            <button
              class="danger"
              onclick="deleteTask(${i})"
            >削除</button>

          </div>

        `).join("")}

      </div>

      <button class="primary" onclick="addTask()">
        ＋ 予定を追加
      </button>

    </div>

    <div class="card">

      <button
        class="danger"
        onclick="deleteRoutine()"
      >
        このルーティンを削除
      </button>

    </div>
  `;

}

function changeTitle(value){
  routines[currentRoutine].title=value;
  save();
  renderTabs();
}

function toggleDay(day){

  const r=routines[currentRoutine];

  if(r.days.includes(day)){
    r.days=r.days.filter(x=>x!==day);
  }else{
    r.days.push(day);
  }

  save();
  render();
}

function changeTime(i,value){
  routines[currentRoutine].tasks[i].time=value;
  save();
}

function changeText(i,value){
  routines[currentRoutine].tasks[i].text=value;
  save();
}

function addTask(){

  routines[currentRoutine].tasks.push({
    time:"12:00",
    text:"新しい予定"
  });

  save();
  render();
}

function deleteTask(i){

  routines[currentRoutine].tasks.splice(i,1);

  save();
  render();
}

function addRoutine(){

  routines.push({
    title:"新しいルーティン",
    days:[],
    tasks:[]
  });

  currentRoutine=routines.length-1;

  save();
  render();
}

function deleteRoutine(){

  if(routines.length<=1){
    alert("最後のルーティンは削除できません");
    return;
  }

  routines.splice(currentRoutine,1);

  currentRoutine=0;

  save();
  render();
}


// 通知許可

async function enableNotifications(){

  if(!("Notification" in window)){

    alert("このブラウザは通知に対応していません。");

    return;
  }

  const permission=await Notification.requestPermission();

  const status=document.getElementById("notificationStatus");

  if(permission==="granted"){

    status.textContent="🔔 通知がONになっています！";

    new Notification("ルーティン",{
      body:"通知テスト成功！"
    });

  }else{

    status.textContent="通知が許可されていません。";

  }

}


// Service Worker登録

if("serviceWorker" in navigator){

  navigator.serviceWorker.register("./sw.js")
    .then(()=>{
      console.log("Service Worker 登録成功");
    })
    .catch(err=>{
      console.log("Service Worker 登録失敗",err);
    });

}

render();

</script>

</body>
</html>
